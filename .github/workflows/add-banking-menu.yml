name: Add Banking and Compliance hover menu

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-banking-menu.yml

permissions:
  contents: write

jobs:
  add-banking-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply Banking and Compliance menu patch
        run: python3 .github/scripts/add-banking-menu.py

      - name: Commit Banking and Compliance menu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html banking-menu.js
          git commit -m "Add Banking and Compliance two-way hover menu"
          git push origin HEAD:main
