name: Simplify USA Business Access Services menu

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/simplify-services-menu.yml

permissions:
  contents: write

jobs:
  simplify-services-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove redundant Services items and retitle sections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          company_pattern = re.compile(
              r'\n\s*<section class="services-menu-column" aria-labelledby="services-company-heading">.*?</section>\n',
              re.DOTALL,
          )
          html, count = company_pattern.subn('\n', html, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Company Services menu section; found {count}.')

          html = html.replace('<span class="services-menu-kicker">Capital readiness</span>\n                  <h2 id="services-credit-heading">Credit &amp; Financing</h2>', '<span class="services-menu-kicker">Capital readiness</span>\n                  <h2 id="services-credit-heading">Financing &amp; Credit</h2>', 1)

          html = html.replace('<span class="services-menu-kicker">U.S. opportunity</span>\n                  <h2 id="services-market-heading">Market Access &amp; Advisory</h2>', '<span class="services-menu-kicker">Strategy &amp; transactions</span>\n                  <h2 id="services-market-heading">Advisory &amp; Acquisition</h2>', 1)
          html = html.replace('                <a href="#market-entry-growth"><span>Market Entry &amp; Growth</span><b aria-hidden="true">→</b></a>\n', '', 1)

          html = html.replace('<span class="services-menu-kicker">Education</span>\n                  <h2 id="services-learning-heading">Learning Center</h2>', '<span class="services-menu-kicker">Knowledge &amp; tools</span>\n                  <h2 id="services-learning-heading">Learning &amp; Resources</h2>', 1)

          index_path.write_text(html, encoding='utf-8')

          css_path = Path('styles.css')
          css = css_path.read_text(encoding='utf-8')
          css, count = re.subn(r'(\.services-mega-menu\s*\{.*?grid-template-columns:)\s*repeat\(4, minmax\(0, 1fr\)\);', r'\1 repeat(3, minmax(0, 1fr));', css, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit('Could not update Services mega-menu to three columns.')
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Commit simplified Services menu
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Simplify Services menu and remove redundant header items"
          git push origin HEAD:main
