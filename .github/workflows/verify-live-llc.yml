name: Verify live LLC page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-llc.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Verify repository and production LLC image
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 'https://www.usabusinessaccess.com/llc-formation' -o /tmp/live.html
          python - <<'PY'
          import base64, re
          from pathlib import Path
          from PIL import Image

          def verify(path, label):
              html = Path(path).read_text(encoding='utf-8')
              m = re.search(r'src="data:image/(jpeg|webp|png);base64,([A-Za-z0-9+/=]+)"', html)
              if not m:
                  raise SystemExit(f'FAIL {label}: data URI not found')
              fmt, payload = m.groups()
              data = base64.b64decode(payload, validate=True)
              out = Path(f'/tmp/{label}.{fmt}')
              out.write_bytes(data)
              with Image.open(out) as im:
                  im.verify()
              with Image.open(out) as im:
                  im.load()
                  print(f'PASS {label}: {im.format} {im.size[0]}x{im.size[1]} bytes={len(data)}')

          verify('llc-formation.html', 'repo')
          verify('/tmp/live.html', 'live')
          PY
