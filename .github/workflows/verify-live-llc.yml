name: Verify live LLC page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-llc.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Verify repository and production LLC asset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          p='assets/llc-formation-approved-v4.webp'
          with Image.open(p) as im:
              im.verify()
          with Image.open(p) as im:
              im.load()
              assert im.size == (700, 933), im.size
              print(f'PASS repo: {im.format} {im.size[0]}x{im.size[1]}')
          PY
          for i in $(seq 1 20); do
            if curl -fsSL --retry 2 'https://www.usabusinessaccess.com/assets/llc-formation-approved-v4.webp' -o /tmp/live.webp; then
              if python - <<'PY'
          from PIL import Image
          p='/tmp/live.webp'
          try:
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  im.load()
                  assert im.size == (700, 933), im.size
                  print(f'PASS live asset: {im.format} {im.size[0]}x{im.size[1]}')
          except Exception as e:
              print(f'WAIT live asset: {e}')
              raise SystemExit(1)
          PY
              then
                curl -fsSL 'https://www.usabusinessaccess.com/llc-formation' -o /tmp/live.html
                grep -q '/assets/llc-formation-approved-v4.webp' /tmp/live.html
                echo 'PASS live page references intact asset'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'FAIL: live LLC asset/page did not verify after retries'
          exit 1
