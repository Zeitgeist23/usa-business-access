name: Apply approved USA Business Access footer logo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-approved-footer-logo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-footer-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add exact approved footer logo and replace substitute wordmark
        shell: bash
        env:
          FOOTER_LOGO_URL: 'https://oaisdmntprcentralus.blob.core.windows.net/files/00000000-ebac-81f5-9c11-622eb3996b9d/raw?se=2026-09-01T01%3A01%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=01a05a75-e2ad-7f22-98e0-124665ab2f29&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T23%3A25%3A18Z&ske=2026-09-01T23%3A25%3A18Z&sks=b&skv=2026-02-06&sig=i%2BhKFukk2PRAV0qRnwUO17YJe0BpOof0Scxi5HAyYGE%3D'
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 5 --retry-all-errors "$FOOTER_LOGO_URL" --output assets/usa-business-access-footer-logo-v3.png
          echo "1850e095dc2228f4a46df1318f402c504656870905bef97eb55dcb1fd66c62c9  assets/usa-business-access-footer-logo-v3.png" | sha256sum --check -

          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?P<indent>\s*)<div class="footer-wordmark" aria-label="USA Business Access">.*?</div>\s*'
              r'<p>Your gateway to doing business<br />in America</p>',
              re.DOTALL,
          )
          replacement = (
              '              <img\n'
              '                class="footer-logo-image"\n'
              '                src="assets/usa-business-access-footer-logo-v3.png"\n'
              '                alt="USA Business Access — Your Gateway to Doing Business in America"\n'
              '                width="360"\n'
              '                height="88"\n'
              '                decoding="async"\n'
              '                draggable="false"\n'
              '                style="display:block;width:min(100%,360px);height:auto;margin:0 0 19px;"\n'
              '              />'
          )
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one substitute footer wordmark block; found {count}.')
          path.write_text(updated, encoding='utf-8')
          PYCODE

      - name: Commit correction to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/usa-business-access-footer-logo-v3.png
          if git diff --cached --quiet; then
            echo "Approved footer logo is already applied."
            exit 0
          fi
          git commit -m "Replace footer wordmark with approved logo"
          git push origin HEAD:main
