name: Apply approved USA Business Access footer logo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-approved-footer-logo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-footer-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify the approved footer logo asset
        shell: bash
        run: |
          set -euo pipefail
          echo '1850e095dc2228f4a46df1318f402c504656870905bef97eb55dcb1fd66c62c9  assets/usa-business-access-footer-logo-v3.png' | sha256sum --check -

      - name: Replace the handmade footer wordmark with the approved logo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')

          if 'class="footer-logo-image"' not in html:
              pattern = re.compile(
                  r'^[ \t]*<div class="footer-wordmark" aria-label="USA Business Access">\n'
                  r'.*?'
                  r'^[ \t]*</div>\n'
                  r'^[ \t]*<p>Your gateway to doing business<br />in America</p>',
                  re.MULTILINE | re.DOTALL,
              )
              new_html = '\n'.join([
                  '              <img',
                  '                class="footer-logo-image"',
                  '                src="assets/usa-business-access-footer-logo-v3.png"',
                  '                alt="USA Business Access — Your Gateway to Doing Business in America"',
                  '                width="720"',
                  '                height="176"',
                  '                decoding="async"',
                  '                loading="eager"',
                  '                draggable="false"',
                  '              />',
              ])
              html, count = pattern.subn(new_html, html, count=1)
              if count != 1:
                  raise SystemExit('Expected handmade footer wordmark block was not found; no changes committed.')
              html_path.write_text(html, encoding='utf-8')

          css_path = Path('styles.css')
          css = css_path.read_text(encoding='utf-8')
          start = css.find('.footer-wordmark {')
          end = css.find('.social-row {', start) if start != -1 else -1
          new_css = '''.footer-logo-image {
            display: block;
            width: min(100%, 360px);
            height: auto;
            margin: 0 0 20px;
            border: 0;
            user-select: none;
            -webkit-user-drag: none;
          }

          '''
          if start != -1 and end != -1:
              css = css[:start] + new_css + css[end:]
              css_path.write_text(css, encoding='utf-8')
          elif '.footer-logo-image {' not in css:
              raise SystemExit('Expected handmade footer wordmark CSS was not found; no changes committed.')
          PY

      - name: Commit the approved footer-logo correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          if git diff --cached --quiet; then
            echo "Approved footer-logo correction is already present."
            exit 0
          fi
          git commit -m "Replace footer wordmark with approved USA Business Access logo"
          git push origin HEAD:main
