name: Check Vercel custom-domain routing

on:
  push:
    branches: [main]
    paths: [.github/workflows/check-vercel-domain-routing.yml]

permissions:
  contents: write

jobs:
  check-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test custom hostnames against Vercel edge
        run: |
          set -u
          {
            echo "Vercel custom-domain route test"
            echo "UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            ips="76.76.21.21"
            resolved=$(getent ahostsv4 cname.vercel-dns.com 2>/dev/null | awk '{print $1}' | sort -u | paste -sd' ' -)
            [ -z "$resolved" ] || ips="$ips $resolved"
            for host in www.usabusinessaccess.com usabusinessaccess.com; do
              for ip in $ips; do
                rm -f /tmp/h /tmp/b
                code=$(curl -k -L -sS --connect-timeout 8 --max-time 25 --resolve "$host:443:$ip" -D /tmp/h -o /tmp/b -w '%{http_code}' "https://$host/" 2>/dev/null || true)
                title=$(grep -oi '<title>[^<]*' /tmp/b 2>/dev/null | head -1 | sed 's/<title>//I' || true)
                bytes=$(wc -c </tmp/b 2>/dev/null || echo 0)
                server=$(grep -i '^server:' /tmp/h 2>/dev/null | tail -1 | tr -d '\r' || true)
                location=$(grep -i '^location:' /tmp/h 2>/dev/null | tail -1 | tr -d '\r' || true)
                echo "$host via $ip | HTTP=$code | bytes=$bytes | title=$title | $server | $location"
              done
            done
          } > VERCEL-DOMAIN-ROUTING.txt
          cat VERCEL-DOMAIN-ROUTING.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERCEL-DOMAIN-ROUTING.txt
          git commit -m "Record Vercel custom-domain routing status" || exit 0
          git push origin HEAD:main
