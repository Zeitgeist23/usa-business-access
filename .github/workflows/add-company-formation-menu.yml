name: Add Company Formation hover menu

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-company-formation-menu.yml

permissions:
  contents: write

jobs:
  add-company-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply Company Formation menu patch
        run: python3 .github/scripts/add-company-menu.py

      - name: Commit Company Formation menu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css company-menu.js services-menu.js
          git commit -m "Add Company and Entity Formation hover menu"
          git push origin HEAD:main
