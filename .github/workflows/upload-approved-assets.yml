name: Upload approved USA Business Access assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/upload-approved-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-approved-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the exact approved PNG files
        env:
          HERO_URL: 'https://oaisdmntprcentralus.blob.core.windows.net/files/00000000-0690-81f5-a62b-a1bbaff5c375/raw?se=2026-08-31T21%3A11%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a059a2-5eca-7ae0-bdd8-f950335ec5e1&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T17%3A47%3A06Z&ske=2026-09-01T17%3A47%3A06Z&sks=b&skv=2026-02-06&sig=awWjFBfshgFzPxlNGrRP/qx9NCyPazCNPl06bqdM1tA%3D'
          LANDING_URL: 'https://oaisdmntprcentralus.blob.core.windows.net/files/00000000-93d8-81f5-980e-24dcc5d446a9/raw?se=2026-08-31T21%3A11%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a059a2-5eca-7ae0-bdd8-f950335ec5e1&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T13%3A08%3A05Z&ske=2026-09-01T13%3A08%3A05Z&sks=b&skv=2026-02-06&sig=caMX1IZWJVG/76ITS5YLIH4PcJR7LVWF0K3cIpUHXFs%3D'
          LOGO_URL: 'https://oaisdmntprcentralus.blob.core.windows.net/files/00000000-7918-81f5-8ce6-ba4467295cf8/raw?se=2026-08-31T21%3A11%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=01a059a2-5eca-7ae0-bdd8-f950335ec5e1&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T14%3A12%3A22Z&ske=2026-09-01T14%3A12%3A22Z&sks=b&skv=2026-02-06&sig=AM17jjS0MOc8XJ3YhwU9tuQD4W/CqS3CRVKvtLTCG2Y%3D'
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 5 --retry-all-errors "$HERO_URL" --output assets/usa-business-access-hero-approved.png
          curl --fail --location --retry 5 --retry-all-errors "$LANDING_URL" --output assets/usa-business-access-landing-approved.png
          curl --fail --location --retry 5 --retry-all-errors "$LOGO_URL" --output assets/usa-business-access-official-logo.png

          cat > /tmp/approved-assets.sha256 <<'CHECKSUMS'
          f2315420790c5f8f80da6caa74892f0eb8386ecc38d7b7d39dc1ce89e20db371  assets/usa-business-access-hero-approved.png
          07a6ebafa58ef27f31c2750f6c33eb9491c1f7ea31ccecea670be4a050a7d0b9  assets/usa-business-access-landing-approved.png
          028dfc6376a7ab9fade35b972ba083b1944f4eac011ae50a47e7cedee06bd728  assets/usa-business-access-official-logo.png
          CHECKSUMS
          sha256sum --check /tmp/approved-assets.sha256
          rm -f assets/UPLOAD-APPROVED-ASSETS-HERE.txt

      - name: Commit the approved assets to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Approved assets are already present and unchanged."
            exit 0
          fi
          git commit -m "Add approved USA Business Access visual assets"
          git push origin HEAD:main
