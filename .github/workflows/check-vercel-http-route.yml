name: Check Vercel HTTP custom-domain route

on:
  push:
    branches: [main]
    paths: [.github/workflows/check-vercel-http-route.yml]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test HTTP host routing
        run: |
          {
            echo "Vercel HTTP host routing test"
            echo "UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            for host in www.usabusinessaccess.com usabusinessaccess.com; do
              rm -f /tmp/h /tmp/b
              code=$(curl -sS --connect-timeout 10 --max-time 25 --resolve "$host:80:76.76.21.21" -D /tmp/h -o /tmp/b -w '%{http_code}' "http://$host/" 2>/dev/null || true)
              echo "$host | HTTP=$code | bytes=$(wc -c </tmp/b 2>/dev/null || echo 0)"
              cat /tmp/h 2>/dev/null | tr -d '\r' | grep -Ei '^(server|location|x-vercel|content-type|content-length):' || true
              head -c 300 /tmp/b 2>/dev/null | tr '\n' ' '; echo
            done
          } > HTTP-ROUTING-STATUS.txt
          cat HTTP-ROUTING-STATUS.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HTTP-ROUTING-STATUS.txt
          git commit -m "Record Vercel HTTP route status" || exit 0
          git push origin HEAD:main
