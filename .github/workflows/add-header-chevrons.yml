name: Add dropdown chevrons to header menus

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-header-chevrons.yml

permissions:
  contents: write

jobs:
  add-chevrons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add Company Formation and Services chevrons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('styles.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* HEADER DROPDOWN CHEVRONS */'
          if marker not in css:
              css += '''\n\n/* HEADER DROPDOWN CHEVRONS */\n.company-menu-toggle::after,\n.services-menu-toggle::after {\n  content: "";\n  position: absolute;\n  top: 50%;\n  right: 2px;\n  width: 7px;\n  height: 7px;\n  border-right: 2px solid var(--brand-blue);\n  border-bottom: 2px solid var(--brand-blue);\n  pointer-events: none;\n  transform: translateY(-72%) rotate(45deg);\n  transform-origin: 55% 55%;\n  transition: transform .16s ease;\n}\n.company-menu-toggle[aria-expanded="true"]::after,\n.services-menu-toggle[aria-expanded="true"]::after {\n  transform: translateY(-28%) rotate(225deg);\n}\n'''
              path.write_text(css, encoding='utf-8')
          PY

      - name: Commit header chevrons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Add dropdown chevrons to Company Formation and Services"
          git push origin HEAD:main
