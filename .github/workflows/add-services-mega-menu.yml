name: Add USA Business Access Services mega menu

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-services-mega-menu.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-services-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build the Services mega menu
        run: python3 .github/scripts/add-services-menu.py

      - name: Commit Services mega menu
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css services-menu.js
          if git diff --cached --quiet; then
            echo "Services mega menu is already present."
            exit 0
          fi
          git commit -m "Add Services mega menu to USA Business Access"
          git push origin HEAD:main
