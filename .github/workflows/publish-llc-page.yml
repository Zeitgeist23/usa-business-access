name: Publish LLC formation page

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-llc-page.yml

permissions:
  contents: write

jobs:
  publish-llc:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build LLC masthead image assets and wire menu link
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          base64 -d .tmp/llc1.b64 > assets/llc-masthead-operating-agreement.jpg
          base64 -d .tmp/llc2.b64 > assets/llc-masthead-formation-documents.jpg
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="#company-formation"><span>LLC Formation</span><b aria-hidden="true">→</b></a>'
          new = '<a href="/llc-formation"><span>LLC Formation</span><b aria-hidden="true">→</b></a>'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'href="/llc-formation"><span>LLC Formation</span>' not in s:
              raise SystemExit('LLC Formation menu link not found')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit live LLC page wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/llc-masthead-operating-agreement.jpg assets/llc-masthead-formation-documents.jpg index.html
          git commit -m "Publish LLC formation page and masthead crossfade assets"
          git push origin HEAD:main
