name: Add Market Entry and Growth menu script

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-market-menu-script.yml

permissions:
  contents: write

jobs:
  add-market-menu-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add Market Entry and Growth script tag
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          tag = '  <script src="market-menu.js" defer></script>'
          anchor = '  <script src="banking-menu.js" defer></script>'
          if tag not in html:
              if anchor not in html:
                  raise SystemExit('banking-menu.js script tag not found')
              html = html.replace(anchor, anchor + '\n' + tag, 1)
              path.write_text(html, encoding='utf-8')
          PY

      - name: Commit Market Entry and Growth script tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Activate Market Entry and Growth business model menu"
          git push origin HEAD:main
